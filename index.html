<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>ProxPanel — Proxmox Administration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Persistent login form (outside #root). iOS Safari / 1Password AutoFill
      classify pages from a real username+password form in the document.
      React must reuse these fields instead of creating new ones.
    -->
    <form
      id="login"
      name="login"
      method="post"
      action="/login"
      autocomplete="on"
      data-form-type="login"
      hidden
      onsubmit="event.preventDefault()"
    >
      <div class="mb-4">
        <label for="username" class="mb-1.5 block text-xs text-muted">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          placeholder="root"
          class="w-full rounded-xl border border-line bg-bg px-3 py-3 text-base outline-none focus:border-accent md:text-sm"
          autocomplete="username"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          required
        />
      </div>
      <div class="mb-5">
        <label for="password" class="mb-1.5 block text-xs text-muted">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          class="w-full rounded-xl border border-line bg-bg px-3 py-3 text-base outline-none focus:border-accent md:text-sm"
          autocomplete="current-password"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          required
        />
      </div>
      <div id="login-status"></div>
      <button
        id="login-submit"
        type="submit"
        class="min-h-12 w-full rounded-xl bg-accent py-3 text-sm font-semibold text-black hover:bg-accent-2 disabled:opacity-50"
      >
        Sign in
      </button>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
